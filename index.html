<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<title>飲んで忘れたい夜もある?</title>
</head>
<body>
<main class="page page--yes-no">
  <div class="stage" id="stage">
    <h1 class="copy">飲んで忘れたい<br>夜もある？</h1>
    <div class="buttonRow" id="buttonRow">
      <button type="button" id="yesButton" class="choiceBtn choiceBtn--yes">YES</button>
      <button type="button" id="noButton" class="choiceBtn choiceBtn--no">NO</button>
    </div>
  </div>
  <div class="transitionOverlay" id="transitionOverlay" aria-hidden="true">
    <div class="transitionPhoto" aria-hidden="true"></div>
    <div class="transitionText transitionText--premium transitionText--image" aria-label="そんな貴方に！">
      <img class="transitionLogo" src="sonna-anatani.png" alt="そんな貴方に！">
    </div>
  </div>
</main>
<script src="script.js"></script>
</body>
</html>
